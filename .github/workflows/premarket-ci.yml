name: Premarket CI

on:
  push:
    branches:
      - feature/premarket-report
    paths:
      - src/core/trading_calendar.py
      - src/services/premarket_window_service.py
      - tests/test_premarket_window_service.py
      - tests/test_trading_calendar.py
      - .github/workflows/premarket-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premarket-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: |
          python -m pip install pytest pandas "exchange-calendars>=4.13.0" "fastapi>=0.109.0" httpx

      - name: Run premarket tests
        run: |
          python -m pytest -p no:cacheprovider tests/test_premarket_window_service.py tests/test_trading_calendar.py -q
